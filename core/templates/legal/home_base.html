<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stockiva{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #007AFF;
        }
        
        [data-bs-theme="dark"] {
            --bs-body-bg: #000000;
            --bs-body-color: #f5f5f7;
            --card-bg: #1c1c1e;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .brand-logo {
            background: var(--primary-blue); color: white;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
        }

        /* Mod Değiştirme Butonu Stili */
        .theme-toggle {
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.3s;
            color: var(--bs-body-color);
        }
        .theme-toggle:hover { background: rgba(128, 128, 128, 0.1); }

        .legal-header {
            background: var(--bs-tertiary-bg);
            padding: 80px 0 60px;
            border-bottom: 1px solid var(--bs-border-color);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg py-3 border-bottom sticky-top bg-body">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                <div class="brand-logo"><i class="bi bi-box-seam-fill"></i></div>
                <span class="fw-bold">stockiva</span>
            </a>
            
            <div class="ms-auto d-flex align-items-center gap-3">
                <div class="theme-toggle" id="themeToggler">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </div>
                
                <a href="{% url 'home' %}" class="btn btn-link text-decoration-none text-reset fw-bold small d-none d-sm-block">Vitrini Gör</a>
                <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Giriş Yap</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="py-5 border-top bg-body-tertiary mt-5 text-center">
        <div class="container">
            <p class="small opacity-50 mb-0">© 2026 Stockiva Tech. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script>
        const themeToggler = document.getElementById('themeToggler');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        // Tarayıcı hafızasından tercihi al
        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        themeToggler.addEventListener('click', () => {
            const newTheme = htmlElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
            } else {
                themeIcon.classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
            }
        }
    </script>
    <div id="stockiva-ai-btn" onclick="toggleStockivaChat()" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #007AFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px rgba(0,122,255,0.3); z-index: 9999; transition: all 0.3s ease;">
    <i class="bi bi-robot" style="color: white; font-size: 1.6rem;"></i>
</div>

<div id="stockiva-chat-box" style="position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: white; border-radius: 20px; display: none; flex-direction: column; box-shadow: 0 15px 40px rgba(0,0,0,0.15); z-index: 9999; overflow: hidden; border: 1px solid #eee;">
    
    <div style="background: #007AFF; padding: 15px; color: white; display: flex; justify-content: space-between; align-items: center;">
        <span class="fw-bold"><i class="bi bi-stars me-2"></i>Stockiva AI Asistan</span>
        <i class="bi bi-dash-lg" onclick="toggleStockivaChat()" style="cursor: pointer;"></i>
    </div>

    <div id="chat-content" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9;">
        <div style="background: #e9ecef; padding: 8px 12px; border-radius: 12px 12px 12px 0; max-width: 85%; font-size: 0.85rem;">
            Selam! Ben Stockiva Bot. Sana nasıl yardımcı olabilirim? 🚀
        </div>
    </div>

    <div style="padding: 12px; background: white; border-top: 1px solid #eee;">
        <div class="input-group">
            <input type="text" id="chat-input" class="form-control form-control-sm border-0 bg-light" placeholder="Sorunuzu yazın..." onkeypress="handleChatKey(event)">
            <button class="btn btn-primary btn-sm" onclick="sendToAI()"><i class="bi bi-send"></i></button>
        </div>
    </div>
</div>

<script>
    // Pencereyi aç/kapat ama içeriği sıfırlama
    function toggleStockivaChat() {
        const chatBox = document.getElementById('stockiva-chat-box');
        chatBox.style.display = (chatBox.style.display === 'none' || chatBox.style.display === '') ? 'flex' : 'none';
    }

    function handleChatKey(e) {
        if (e.key === 'Enter') sendToAI();
    }

    function sendToAI() {
        const input = document.getElementById('chat-input');
        const content = document.getElementById('chat-content');
        const msg = input.value.trim();

        if (msg === "") return;

        // Kullanıcı mesajını ekle
        const userDiv = document.createElement('div');
        userDiv.style = "background: #007AFF; color: white; padding: 8px 12px; border-radius: 12px 12px 0 12px; max-width: 85%; align-self: flex-end; font-size: 0.85rem;";
        userDiv.innerText = msg;
        content.appendChild(userDiv);
        
        input.value = "";
        content.scrollTop = content.scrollHeight;

        // Yazıyor... efekti
        const typingDiv = document.createElement('div');
        typingDiv.id = "typing-indicator";
        typingDiv.style = "background: #eee; padding: 5px 10px; border-radius: 10px; font-size: 0.75rem; align-self: flex-start;";
        typingDiv.innerText = "Stockiva yanıtlıyor...";
        content.appendChild(typingDiv);

        // AJAX ile Backend'e
        fetch('/contact-submit-ajax/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ message: msg })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('typing-indicator').remove();
            const aiDiv = document.createElement('div');
            aiDiv.style = "background: #e9ecef; color: #333; padding: 8px 12px; border-radius: 12px 12px 12px 0; max-width: 85%; align-self: flex-start; font-size: 0.85rem;";
            aiDiv.innerText = data.ai_answer;
            content.appendChild(aiDiv);
            content.scrollTop = content.scrollHeight;
        });
    }
</script>
</body>
</html>
